<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: file: https://fonts.googleapis.com https://fonts.gstatic.com; media-src file: blob: *;">
  <title>Koda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Custom titlebar -->
<div id="titlebar">
  <div id="titlebar-drag">
    <span id="app-name">Koda</span>
  </div>
  <div id="window-controls">
    <button class="wc-btn" id="btn-min" title="Minimize">
      <svg width="10" height="2" viewBox="0 0 10 2"><rect width="10" height="1.5" rx="0.75" fill="currentColor"/></svg>
    </button>
    <button class="wc-btn" id="btn-max" title="Maximize">
      <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.75" y="0.75" width="8.5" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button class="wc-btn close" id="btn-close" title="Close">
      <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<!-- Dynamic background -->
<div id="bg-layer"></div>

<!-- App shell -->
<div id="app">

  <!-- LEFT SIDEBAR: Nav + Now Playing -->
  <aside id="sidebar">
    <nav id="nav">
      <button class="nav-btn active" data-view="songs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Songs
      </button>
      <button class="nav-btn" data-view="albums" id="nav-albums">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        Albums
      </button>
      <button class="nav-btn" data-view="artists" id="nav-artists">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Artists
      </button>
      <button class="nav-btn" data-view="genres" id="nav-genres">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Genres
      </button>
      <button class="nav-btn" data-view="favourites">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.07 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
  Favourites
</button>
  <button class="nav-btn" data-view="playlists">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Playlists
  </button>
    </nav>

    <div id="sidebar-spacer"></div>

    <!-- Now Playing mini card -->
    <div id="now-playing-card" class="hidden">
      <div id="np-art-wrap">
        <img id="np-art" src="" alt="">
        <div id="np-art-placeholder">♪</div>
      </div>
      <div id="np-info">
        <div id="np-title">—</div>
        <div id="np-artist">—</div>
      </div>
    </div>

    <button id="folder-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Change Folder
    </button>

  </aside>

  <!-- MAIN CONTENT AREA -->
  <div id="content">

    <!-- Search + Sort bar -->
    <div id="topbar">
      <div id="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search…">
      </div>
      <div id="view-options">
        <button class="view-toggle active" data-layout="list" title="List view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <button class="view-toggle" data-layout="grid" title="Grid view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
      </div>
      <button id="selection-mode-btn">Select</button>
    </div>

    <!-- View title -->
    <div id="view-header">
      <h1 id="view-title">Songs</h1>
      <span id="view-count"></span>
    </div>

    <!-- Loading state -->
    <div id="loading-state" class="hidden">
      <div class="loading-spinner"></div>
      <p id="loading-text">Scanning your library…</p>
    </div>

    <!-- Empty / welcome state -->
    <div id="welcome-state">
      <div id="welcome-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <h2>Welcome to Koda</h2>
      <p>Choose a folder to load your music library.</p>
      <button id="welcome-folder-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Open Music Folder
      </button>
    </div>

    <!-- Main list/grid view -->
    <div id="library-view" class="hidden"></div>

    <!-- Detail view (album/artist/genre drill-down) -->
    <div id="detail-view" class="hidden">
      <button id="detail-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div id="detail-header"></div>
      <div id="detail-tracks"></div>
    </div>

  </div>

  <!-- RIGHT PANEL: Player -->
  <div id="player-panel">

    <!-- Album Art -->
    <div id="art-container">
      <div id="art-glow"></div>
      <div id="art-frame">
        <img id="art-img" src="" alt="Album Art" class="hidden">
        <div id="art-empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
      </div>
    </div>

    <!-- Song Info -->
    <div id="player-info">
      <div id="player-title">—</div>
      <div id="player-artist">—</div>
      <div id="player-album">—</div>
    </div>

    <!-- Seek -->
    <div id="seek-container">
      <span class="time-label" id="time-current">0:00</span>
      <div id="seek-track">
        <div id="seek-fill"></div>
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1">
      </div>
      <span class="time-label" id="time-total">0:00</span>
    </div>

    <!-- Controls -->
    <div id="controls">
      <button class="ctrl-btn" id="btn-shuffle" title="Shuffle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-prev" title="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button id="btn-play">
        <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-next" title="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-repeat" title="Repeat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <!-- Volume -->
    <div id="volume-row">
      <button id="btn-mute" class="ctrl-btn small">
        <svg id="icon-vol" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <svg id="icon-mute" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      </button>
      <div id="vol-track">
        <div id="vol-fill"></div>
        <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>

    <!-- Queue toggle -->
    <div id="queue-section">
      <button id="queue-toggle">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Queue
      </button>
      <div id="queue-list" class="hidden"></div>
    </div>

  </div>
  <div id="resizer-left" class="resizer"></div>
  <div id="resizer-right" class="resizer"></div>
</div>

<!-- Settings modal -->
<div id="settings-overlay" class="hidden">
  <div id="settings-modal">
    <div id="settings-header">
      <h2>Settings</h2>
      <button id="settings-close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="settings-section">
      <h3>Visible Views</h3>
      <label class="toggle-row">
        <span>Albums</span>
        <input type="checkbox" id="toggle-albums" checked>
        <span class="toggle-slider"></span>
      </label>
      <label class="toggle-row">
        <span>Artists</span>
        <input type="checkbox" id="toggle-artists" checked>
        <span class="toggle-slider"></span>
      </label>
      <label class="toggle-row">
        <span>Genres</span>
        <input type="checkbox" id="toggle-genres" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="settings-section">
      <h3>Appearance</h3>
      <label class="toggle-row">
        <span>Dynamic theme from album art</span>
        <input type="checkbox" id="toggle-theme" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
</div>
<!-- Add Songs Modal -->
<div id="add-songs-modal" class="hidden">
  <div class="add-songs-content">
    <div class="add-songs-header">
      <h3>Add Songs to Playlist</h3>
      <button id="close-add-songs">✕</button>
    </div>
    <div class="add-songs-list" id="add-songs-list"></div>
    <div class="add-songs-footer">
      <button id="cancel-add-songs">Cancel</button>
      <button id="confirm-add-songs">Add Selected</button>
    </div>
  </div>
</div>

<!-- Context menu (hidden initially) -->
<div id="context-menu" class="hidden"></div>

<div id="confirm-modal" class="hidden">
  <div class="confirm-modal-content">
    <p id="confirm-message"></p>
    <div class="confirm-buttons">
      <button id="confirm-yes">Yes</button>
      <button id="confirm-no">Cancel</button>
    </div>
  </div>
</div>

<!-- Playlist modal -->
<div id="playlist-modal" class="hidden">
  <div class="modal-content">
    <h3>Create New Playlist</h3>
    <label>Name</label>
    <input type="text" id="playlist-name" placeholder="My playlist">
    <label>Mood / Emotion</label>
    <select id="playlist-mood">
      <option value="">None</option>
      <option>Chill</option>
      <option>Happy</option>
      <option>Sad</option>
      <option>Energetic</option>
      <option>Focus</option>
      <option>Romantic</option>
    </select>
    <label>Cover Image</label>
    <button id="playlist-cover-picker">Choose image</button>
    <div id="playlist-cover-preview"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
      <button id="playlist-modal-cancel" class="btn-secondary">Cancel</button>
      <button id="playlist-modal-create">Create</button>
    </div>
  </div>
</div>

<audio id="audio-el"></audio>

<script src="app.js"></script>
</body>
</html>
